<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B3A23">
<link rel="icon" type="image/png" href="/icon-sm.png">
<title>Tiada Admin Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap">
<style>
/* Layout: desktop console. Fixed green sidebar (nav), content column; orders use a queue + detail split. Collapses to top bar + drawer on phones. */
:root{
  --green:#0B3A23;--green-2:#14532F;--green-soft:#E6EEE8;--gold:#D49B41;--gold-soft:#F7ECD9;--gold-ink:#8A5F1C;
  --cream:#FBF9F4;--card:#fff;--ink:#18241D;--muted:#6B7A70;--line:#E9E4D8;--red:#B8402B;--red-soft:#F8E4DF;--blue:#25507E;--blue-soft:#E3ECF7;
  --f-ui:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;--f-tag:'Playfair Display',Georgia,serif;
  --sh1:0 1px 2px rgba(11,58,35,.05),0 4px 14px rgba(11,58,35,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12px}
.tag{font-family:var(--f-tag);font-style:italic;font-weight:700}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,#0B3A23,#0E4429);color:#D6E3DA;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.brand img{height:40px;background:#FBF9F4;border-radius:10px;padding:3px}
.brand b{display:block;color:#fff;font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.1}
.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:.2em;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h6{margin:14px 10px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(214,227,218,.5)}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:#D6E3DA;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:600;text-align:left;position:relative}
.nav button svg{flex:none;opacity:.85}
.nav button.on{background:rgba(255,255,255,.1);color:#fff}
.nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .cnt{margin-left:auto;background:var(--gold);color:var(--green);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav .cnt.red{background:#E2725B;color:#fff}
.nav .cnt.blink{animation:ledN 1s ease-in-out infinite}
@media (hover:hover){.nav button:not(.on):hover{background:rgba(255,255,255,.06);color:#fff}}
.side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:12px 8px 0;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.side .me b{display:block;color:#fff;font-size:13px}
.side .me small{color:rgba(214,227,218,.7);font-size:11px}
.side .me button{margin-left:auto;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;border-radius:8px;padding:6px 8px;font-size:11.5px;font-weight:700}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(251,249,244,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px;font-weight:800;color:var(--green);letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:12.5px}
.top .grow{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:5px 10px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#2DB36A;animation:lp 1.6s infinite}
@keyframes lp{70%{box-shadow:0 0 0 7px rgba(45,179,106,0)}0%{box-shadow:0 0 0 0 rgba(45,179,106,.6)}}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative;flex:none}
.ibtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--cream)}
.burger{display:none}
.content{padding:22px 24px 60px;max-width:1320px;width:100%}

/* common */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1)}
.card.pad{padding:16px 18px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800;color:var(--green)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:0;background:linear-gradient(180deg,#145232,#0B3A23);color:#fff;font-weight:700;border-radius:10px;padding:10px 16px;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.gold{background:var(--gold);color:var(--green)}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green);box-shadow:none}
.btn.soft{background:var(--green-soft);color:var(--green);box-shadow:none}
.btn.red{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(1.08)}.btn.ghost:hover{background:var(--green-soft)}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-new{background:#FDE9C8;color:#8A5F1C}.p-packed{background:var(--green-soft);color:var(--green)}.p-route{background:var(--blue-soft);color:var(--blue)}.p-done{background:#EEF0EC;color:#4D5C53}.p-red{background:var(--red-soft);color:var(--red)}.p-gold{background:var(--gold-soft);color:var(--gold-ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea{height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;width:100%}
.field textarea{height:auto;min-height:140px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);outline:none}
.field.bad input{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search input{width:100%;height:40px;border:1.5px solid var(--line);border-radius:999px;padding:0 14px 0 38px;background:#fff}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gold)}
.seg{display:inline-flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--green);color:#fff}
.seg button .c{opacity:.7;margin-left:4px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--green);font-size:15px;margin-bottom:4px}
.thumb{width:44px;height:44px;border-radius:10px;background:#F4F0E6;display:grid;place-items:center;overflow:hidden;flex:none}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:contain}
.note{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.safe{background:var(--green-soft);color:var(--green);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;font-weight:600}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px}
.kpi small{color:var(--muted);font-weight:700;font-size:12px}
.kpi b{display:block;font-size:26px;font-weight:800;color:var(--ink);margin-top:2px;letter-spacing:-.01em}
.kpi .d{font-size:12px;font-weight:700;color:var(--green)}
.kpi .d.warn{color:var(--red)}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:14px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.ctip.on{opacity:1}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}

/* orders */
.osplit{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:14px;align-items:start}
.queue{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 210px);overflow-y:auto;padding:2px}
.ocard{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh1)}
.ocard.on{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.ocard.fresh{animation:flash 1.6s ease-out 2}
@keyframes flash{0%,100%{background:#fff}40%{background:#FFF4DE}}
.ocard .r1{display:flex;align-items:center;gap:8px}
.ocard .id{font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.ocard .nm{font-size:13px;font-weight:600}
.ocard .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
@media (hover:hover){.ocard:not(.on):hover{border-color:#CFC6B2}}
.detail{position:sticky;top:76px}
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:20px;color:var(--green);font-weight:800}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:14px 18px;border-bottom:1px solid var(--line)}
.st{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.st i{height:5px;border-radius:3px;background:var(--line)}
.st.done i{background:var(--green)}.st.done{color:var(--green)}
.st.now i{background:var(--gold)}.st.now{color:var(--gold-ink)}
.dbody{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:16px 18px}
.items .it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.items .it:last-child{border-bottom:0}
.items .it .t{flex:1;min-width:0}
.items .it .t b{font-size:13.5px}
.items .it .t small{display:block;color:var(--muted);font-size:12px}
.swaps{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.swaps span{font-size:11px;font-weight:700;background:#FFF8EC;color:var(--gold-ink);border:1px solid #F0DDBA;border-radius:999px;padding:1px 7px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv b{font-weight:700;overflow-wrap:anywhere}
.box{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.box h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);background:#FDFCF8;border-radius:0 0 16px 16px}
.mails{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.mrow b{font-weight:700}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* table */
.tbl-wrap{overflow-x:auto;border-radius:16px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:820px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:10px 12px;background:#FDFCF8;border-bottom:1px solid var(--line);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.low td{background:#FFF3F0}
.tbl tr.low td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tbl .pn{display:flex;align-items:center;gap:10px;min-width:200px}
.tbl .pn b{display:block}
.tbl select{height:34px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;font-size:12.5px}
.stock{display:inline-flex;align-items:center;gap:4px}
.stock button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800}
.stock b{min-width:30px;text-align:center}
@media (hover:hover){.tbl tbody tr:hover td{background:#FBFAF5}.tbl tr.low:hover td{background:#FFEDE8}}

/* drawer / modal */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(11,30,20,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;justify-content:flex-end;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.drawer{width:min(560px,100%);height:100%;background:var(--cream);overflow-y:auto;padding:20px 22px 40px;animation:si .3s cubic-bezier(.2,.9,.3,1);position:relative}
@keyframes si{from{transform:translateX(100%)}}
.scrim.closing{animation:fo .25s forwards}.scrim.closing .drawer{animation:so .25s forwards}.scrim.closing .modal{animation:mo .25s forwards}
@keyframes fo{to{opacity:0}}@keyframes so{to{transform:translateX(100%)}}@keyframes mo{to{transform:translateY(20px);opacity:0}}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.modal{width:min(440px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.2);animation:mi .25s cubic-bezier(.2,.9,.3,1);position:relative;max-height:90vh;overflow-y:auto}
@keyframes mi{from{transform:translateY(20px);opacity:0}}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;display:grid;place-items:center}
.drawer h2,.modal h2{margin:0 0 4px;font-size:19px;color:var(--green);padding-right:40px}
.sizes-t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.sizes-t th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.sizes-t td{padding:4px 6px}
.sizes-t input{width:100%;height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 8px;background:#fff}
.sizes-t input:focus{border-color:var(--green);outline:none}
.offb{display:inline-block;min-width:44px;text-align:center;font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 6px;background:var(--gold);color:var(--green)}
.offb.none{background:#EEF0EC;color:var(--muted)}
.field label.drop{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--ink)}
.drop{border:2px dashed #D5CCB8;border-radius:14px;background:#fff;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer}
.drop.over{border-color:var(--green);background:var(--green-soft)}
.drop .pv{width:96px;height:96px;border-radius:12px;background:#F4F0E6;display:grid;place-items:center;overflow:hidden;flex:none}
.drop .pv img,.drop .pv svg{width:100%;height:100%;object-fit:cover}
.switch{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#D5D0C4;transition:.2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

/* promos */
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pban{border-radius:14px;overflow:hidden;position:relative;height:140px;color:#fff;display:flex;align-items:center;padding:16px;background:linear-gradient(120deg,#0B3A23,#1d5c39)}
.pban.s3{background:linear-gradient(120deg,#5B3A12,#8A5F1C)}
.pban.off{filter:grayscale(.8);opacity:.6}
.pban .tx{max-width:60%;position:relative;z-index:1}
.pban .tx small{color:var(--gold);font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.pban .tx b{display:block;font-size:19px;line-height:1.15}
.pban .art{position:absolute;right:8px;bottom:-4px;width:42%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.pban .art svg,.pban .art img{width:100%;height:100%;object-fit:contain}
.pban .tm{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;color:var(--gold);z-index:2;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pfoot{padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pfoot .t{flex:1;min-width:0}
.pfoot .t b{display:block;font-size:13.5px}

/* broadcast + email preview */
.bc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.mail{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);font-size:14px;color:#26332B;border:1px solid var(--line)}
.mail .mh{background:#0B3A23;color:#fff;text-align:center;padding:16px 12px 12px;font-weight:800;letter-spacing:.12em;font-size:17px}
.mail .mh img{display:block;margin:0 auto 6px;width:38px}
.mail .rib{background:#FBF9F4;text-align:center;padding:7px;font-family:var(--f-tag);font-style:italic;font-weight:700;color:#B5832E}
.mail .mb{padding:18px 20px;white-space:pre-wrap;line-height:1.6;min-height:120px}
.mail .mb h2{white-space:normal;margin:0 0 8px;font-size:17px;color:#0B3A23}
.mail .cta{display:block;width:max-content;margin:10px auto 4px;background:#0B3A23;color:#fff;border:2px solid #D49B41;border-radius:999px;padding:10px 20px;font-weight:800;font-size:13.5px}
.mail .mf{border-top:2px solid #D49B41;text-align:center;padding:12px;font-size:11px;color:#6B7A70;line-height:1.6}

/* chat */
.chatw{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:calc(100vh - 150px);min-height:480px}
.cq{display:flex;flex-direction:column;overflow:hidden}
.cq .lst{overflow-y:auto;flex:1}
.cqi{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.cqi.on{background:var(--green-soft)}
.cqi .t{flex:1;min-width:0}
.cqi .t b{display:block;font-size:13.5px}

const STEP=['new','packed','route','done'];
const STL={new:['New · paid','p-new'],packed:['Packed','p-packed'],route:['On the way','p-route'],done:['Delivered','p-done'],issue:['Problem','p-gold'],refunded:['Refunded','p-red'],cancelled:['Cancelled','p-red']};
const ISSUE=o=>['issue','refunded','cancelled'].includes(o.status)||(o.refunds||[]).length;
const art=id=>PHOTOS.has(id)?`<svg viewBox="0 0 140 140" aria-hidden="true"><use href="#ph-${id}"/></svg>`:`<svg viewBox="0 0 140 140" aria-hidden="true"><rect x="38" y="20" width="64" height="104" rx="8" fill="#D49B41" opacity=".25"/><text x="70" y="78" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="13" fill="#8A5F1C">${esc((byId(id)||{name:'?'}).name.split(' ')[0].toUpperCase())}</text></svg>`;
const thumb=p=>p.img?`<img src="${p.img}" alt="">`:art(p.id);
const itemTotal=it=>{if(it[4]!=null)return it[4]*it[2];const p=byId(it[0]);if(!p)return 0;const s=p.sizes.find(x=>x.label===it[1])||p.sizes[0];return (s.sale||s.price)*it[2]};
const mask=ph=>{ph=(ph||'').replace(/\D/g,'');return ph.length>=8?ph.slice(0,4)+' ••• '+ph.slice(-4):ph};
const fmtPhone=p=>{p=(p||'').replace(/\D/g,'');return p.length===11?p.slice(0,4)+' '+p.slice(4,7)+' '+p.slice(7):p};
const lowStock=()=>S.products.filter(p=>p.status!=='out'&&p.stock<=p.low);
const waitingChats=()=>S.chats.filter(c=>c.status==='waiting');
const pendingReviews=()=>S.reviews.filter(r=>r.status==='pending');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
function loading(msg,ms){return new Promise(r=>{$('#ldt').textContent=msg;$('#loader').hidden=false;setTimeout(()=>{$('#loader').hidden=true;r()},ms||600)})}
function closeModal(){const m=$('#modal'),sc=m.firstElementChild;if(!sc)return;sc.classList.add('closing');setTimeout(()=>{if(m.firstElementChild===sc)m.innerHTML=''},240)}

    <div class="me"><span class="av">${esc(S.auth.name.split(' ').map(w=>w[0]).join('').slice(0,2))}</span><span><b>${esc(S.auth.name)}</b><small>${esc(S.auth.role)}</small></span><button data-act="logout" aria-label="Sign out">Sign out</button></div>
   </aside>

    <div class="content" id="content">${({layout:vLayout,dash:vDash,orders:vOrders,inventory:vInv,promos:vPromos,chat:vChat,broadcast:vBroadcast,reviews:vReviews,customers:vCustomers,delivery:vDelivery,security:vSecurity})[S.view]()}</div></div></div>`;

/* ---------- dashboard ---------- */
const DAYS=(()=>{const a=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000);a.push(d)}return a})();
const SALES=[148000,212500,96500,187000,264000,231500,0];
function vDashBase(){
  const today=S.orders.filter(o=>Date.now()-o.at<86400000);
  const newO=S.orders.filter(o=>o.status==='new').length,route=S.orders.filter(o=>o.status==='route').length;

  return `<div class="kpis">

    <div class="card kpi"><small>Waiting to be packed</small><b class="num">${newO}</b><span class="d ${newO?'warn':''}">${newO?'Needs action':'All caught up'}</span></div>
    <div class="card kpi"><small>On the way</small><b class="num">${route}</b><span class="d">Riders and couriers</span></div>
    <div class="card kpi"><small>Low or sold out</small><b class="num">${lowStock().length+S.products.filter(p=>p.status==='out').length}</b><span class="d warn">${lowStock().length} low · ${S.products.filter(p=>p.status==='out').length} sold out</span></div>
  </div>
  <div class="dash">
   <div class="card pad"><div class="row"><h3>Sales, last 7 days</h3><span class="sp"></span><span class="hint num">Total ${naira(SALES.reduce((a,b)=>a+b,0))}</span></div>

    <details style="margin-top:6px"><summary class="hint" style="cursor:pointer">Show as table</summary><table class="tbl" style="min-width:0;margin-top:6px"><tbody>${DAYS.map((d,i)=>`<tr><td>${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</td><td class="num" style="text-align:right">${naira(SALES[i])}</td></tr>`).join('')}</tbody></table></details>

     ${waitingChats().length?`<div class="li"><span class="pill p-red">${waitingChats().length} waiting</span><span class="t"><b>Customers asked for a person</b><small>Live chat</small></span><button class="btn sm" data-view="chat">Reply</button></div>`:''}

   </div></div>
  </div>
  <div class="dash" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
   <div class="card pad"><h3>Best sellers this week</h3><div class="list">${top.length?"":"<p class=\"hint\" style=\"margin:0\">Sales will show here.</p>"}${top.map(([id,n])=>{const p=byId(id);return `<div class="li"><span class="thumb">${thumb(p)}</span><span class="t"><b>${esc(p.name)}</b><div class="bar"><i style="width:${n/top[0][1]*100}%"></i></div></span><span class="num hint" style="font-weight:700;color:var(--ink)">${n} sold</span></div>`}).join('')}</div></div>
   <div class="card pad"><h3>Latest orders</h3><div class="list">${S.orders.length?'':'<p class="hint" style="margin:0">New paid orders appear here automatically.</p>'}${S.orders.slice(0,5).map(o=>`<div class="li">${['new','route','issue'].includes(o.status)?`<span class="led ${o.status}" aria-hidden="true"></span>`:'<span style="width:10px"></span>'}<span class="t"><b class="num">${o.id} · ${esc(o.name)}</b><small>${ago(o.at)} · ${esc(o.area.split(',')[0])}</small></span><span class="pill ${STL[o.status][1]}">${STL[o.status][0]}</span><span class="num" style="font-weight:800;min-width:80px;text-align:right">${naira(o.total)}</span></div>`).join('')}</div></div>

function barChart(v,days,mx){
  const W=640,H=230,pl=56,pr=8,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb,bw=iw/v.length;
  const top=Math.ceil(mx/50000)*50000,ticks=[0,top/2,top];
  const y=x=>pt+ih-(x/top)*ih;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales for the last 7 days">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#E9E4D8" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#6B7A70" font-family="Montserrat">${t?'₦'+(t/1000)+'k':'₦0'}</text>`).join('')}
   ${v.map((x,i)=>{const h=Math.max(2,ih-(y(x)-pt)),bx=pl+i*bw+bw*.22,w=bw*.56,by=y(x);
     return `<g class="bg" data-i="${i}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/><path d="M${bx} ${pt+ih} V${by+4} q0 -4 4 -4 h${w-8} q4 0 4 4 V${pt+ih} Z" fill="${i===6?'#D49B41':'#0B3A23'}"/>
      <text x="${bx+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6B7A70" font-family="Montserrat">${i===6?'Today':days[i].toLocaleDateString('en-GB',{weekday:'short'})}</text></g>`}).join('')}
   <line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="#CFC6B2"/>
  </svg>`;
}
function wireChart(){const c=$('#chart');if(!c)return;const tip=$('#ctip');
  c.querySelectorAll('.bg').forEach(g=>{g.addEventListener('pointerenter',()=>{const i=+g.dataset.i,r=g.getBoundingClientRect(),cr=c.getBoundingClientRect();tip.innerHTML=`<b>${naira(SALES[i])}</b> · ${DAYS[i].toLocaleDateString('en-GB',{weekday:'long'})}`;tip.style.left=(r.left-cr.left+r.width/2)+'px';tip.style.top=(r.top-cr.top+40)+'px';tip.classList.add('on');g.querySelector('path').style.opacity='.8'});
    g.addEventListener('pointerleave',()=>{tip.classList.remove('on');g.querySelector('path').style.opacity=''})})}

function vOrders(){
  const F=[['new','New'],['packed','Packed'],['route','On the way'],['done','Delivered'],['issues','Problems & refunds'],['all','All']];
  let list=S.orders.filter(o=>S.ofilter==='all'||(S.ofilter==='issues'?ISSUE(o):o.status===S.ofilter));
  if(S.oq){const q=S.oq.toLowerCase();list=S.orders.filter(o=>(o.id+' '+o.name+' '+o.phone+' '+o.area).toLowerCase().includes(q))}
  if(!S.sel||!list.find(o=>o.id===S.sel))S.sel=list[0]?list[0].id:null;
  const o=S.orders.find(x=>x.id===S.sel);
  return `<div class="row" style="margin-bottom:14px"><div class="seg">${F.map(f=>`<button class="${S.ofilter===f[0]&&!S.oq?'on':''}" data-of="${f[0]}">${f[1]}<span class="c num">${f[0]==='all'?S.orders.length:f[0]==='issues'?S.orders.filter(ISSUE).length:S.orders.filter(x=>x.status===f[0]).length}</span></button>`).join('')}</div><span class="sp"></span>
   <label class="search">${ic('search',16)}<input id="oq" placeholder="Search code, name, phone or area" value="${esc(S.oq)}" aria-label="Search orders"></label></div>
  <div class="legend"><span><i class="led new"></i>Blinking: needs action now (new order or problem)</span><span><i class="led route"></i>Steady blue: on the way, nothing to do</span></div>
  <div class="osplit">
   <div class="queue" id="queue">${list.length?list.map(x=>`<button class="ocard st-${x.status} ${x.id===S.sel?'on':''} ${x.fresh?'fresh':''}" data-osel="${x.id}">
     <span class="r1">${['new','route','issue'].includes(x.status)?`<span class="led ${x.status}" aria-hidden="true"></span>`:''}<span class="id">${x.id}</span><span class="pill ${STL[x.status][1]}">${STL[x.status][0]}</span>${(x.refunds||[]).length&&x.status!=='refunded'?'<span class="pill p-red">Part refund</span>':''}<span class="sp"></span><b class="num">${naira(x.total)}</b></span>
     <span class="nm">${esc(x.name)}</span><span class="meta"><span>${ic('clock',13)} ${ago(x.at)}</span><span>${ic('pin',13)} ${esc(x.area.split(',')[0])}</span><span>${x.items.reduce((a,i)=>a+i[2],0)} items</span></span></button>`).join(''):`<div class="card empty"><b>No orders here</b>New paid orders appear at the top automatically.</div>`}</div>
   <div>${o?orderDetail(o):''}</div>
  </div>`;
}
function orderDetail(o){
  const ix=STEP.indexOf(o.status==='issue'?(o.prev||'packed'):o.status),kg=o.items.reduce((a,it)=>{const p=byId(it[0]);const s=p&&(p.sizes.find(x=>x.label===it[1])||p.sizes[0]);return a+(s?s.kg*it[2]:0)},0);
  const sent=S.sent.filter(m=>m.oid===o.id);
  return `<div class="card detail">
   <div class="dhead"><div><h2 class="num">${o.id}</h2><div class="hint">${esc(o.name)} · paid ${dstr(o.at)} at ${tstr(o.at)}</div></div><span class="sp"></span>${['new','route','issue'].includes(o.status)?`<span class="led ${o.status}" aria-hidden="true" style="align-self:center"></span>`:''}<span class="pill ${STL[o.status][1]}">${STL[o.status][0]}</span></div>
   ${o.status==='refunded'||o.status==='cancelled'?`<div class="note" style="margin:12px 18px;background:var(--red-soft);color:var(--red)">${ic('alert',16)}<span><b>${o.status==='refunded'?'Refunded':'Cancelled'}</b> · ${naira((o.refunds||[]).reduce((a,r)=>a+r.amount,0))} returned to ${esc(o.bank)}. ${esc(o.reason||'')}</span></div>`
     :`<div class="steps">${['Paid','Packed','On the way','Delivered'].map((l,i)=>`<div class="st ${i<ix||o.status==='done'?'done':i===ix?'now':''}"><i></i>${l}</div>`).join('')}</div>`}
   ${o.status==='issue'?`<div class="note" style="margin:0 18px 4px">${ic('alert',16)}<span><b>Problem reported:</b> ${esc(o.issue.reason)}${o.issue.note?' · '+esc(o.issue.note):''}</span></div>`:''}
   ${(o.refunds||[]).length&&o.status!=='refunded'&&o.status!=='cancelled'?`<div class="note" style="margin:0 18px 4px;background:var(--red-soft);color:var(--red)">${ic('alert',16)}<span><b>Part refund:</b> ${o.refunds.map(r=>naira(r.amount)+' · '+esc(r.reason)).join('; ')}</span></div>`:''}
   <div class="dbody">
    <div>
     <div class="box"><h4>Pack list · ${kg.toFixed(1)} kg</h4><div class="items">${o.items.map(it=>{const p=byId(it[0]);return `<div class="it"><span class="thumb">${thumb(p)}</span><span class="t"><b>${esc(it[5]||p.name)}</b> <span class="num">× ${it[2]}</span><small>${it[1]}${p.items?' · '+p.items.length+' items':''}</small>${(it[3]||[]).length?`<span class="swaps">${it[3].map(w=>`<span>${esc(w[0])} → ${esc(w[1])}</span>`).join('')}</span>`:''}</span><span class="num" style="font-weight:700">${naira(itemTotal(it))}</span></div>`}).join('')}</div></div>
     <div class="box" style="margin-bottom:0"><h4>Payment</h4><div class="kv"><span>Method</span><b>Bank transfer · one-time account</b><span>Delivery fee</span><b class="num">${naira(o.fee)}</b><span>Total</span><b class="num">${naira(o.total)}</b><span>Status</span><b style="color:var(--green)">✓ Confirmed automatically by Paystack</b></div></div>
    </div>
    <div>
     <div class="box"><h4>Deliver to</h4><div class="kv"><span>Name</span><b>${esc(o.name)}</b><span>Phone</span><b class="num">${fmtPhone(o.phone)}</b><span>Address</span><b>${esc(o.addr)}</b>${o.landmark?`<span>Landmark</span><b>${esc(o.landmark)}</b>`:''}<span>Area</span><b>${esc(o.area)}</b><span>Speed</span><b>${esc(o.speed)}</b>${o.rider?`<span>Delivery partner</span><b>${riderLine(o.rider)}</b>${o.confirm?`<span>Delivered</span><b style="color:var(--green)">✓ ${esc(o.confirm.how)}${o.confirm.note?' · '+esc(o.confirm.note):''} <span class="hint">(${esc(o.confirm.by)}, ${tstr(o.confirm.at)})</span></b>`:''}${o.rider.cost?`<span>Partner cost</span><b class="num">${naira(o.rider.cost)} <span class="hint">(customer paid ${naira(o.fee)})</span></b>`:''}`:''}</div></div>
     <div class="box" style="margin-bottom:0"><h4>Customer emails</h4><div class="mails">
      ${mailRows(o,ix)}
     </div></div>
    </div>
   </div>
   <div class="actions">
    ${o.status==='new'?`<button class="btn" data-oact="pack">${ic('box',16)} Mark as packed</button><span class="hint" style="align-self:center">Stock is taken off automatically.</span>`:''}
    ${o.status==='packed'?`<button class="btn" data-oact="dispatch">${ic('truck',16)} Mark as on the way</button><span class="hint" style="align-self:center">Add the ${o.state?'courier waybill':'bike booking'} and email the customer.</span>`:''}
    ${o.status==='route'?`<button class="btn" data-oact="deliver">${ic('check',16)} Mark as delivered</button><span class="hint" style="align-self:center">Sends the delivered email and asks for a review.</span>`:''}
    ${o.status==='done'?`<span class="pill p-done">${ic('check',13)} Completed</span>`:''}
    ${o.status==='issue'?`<button class="btn" data-oact="resume">${ic('truck',16)} Problem sorted · continue</button>`:''}
    ${o.status!=='refunded'&&o.status!=='cancelled'?`<button class="btn soft" data-oact="update">${ic('edit',16)} Update status</button>`:''}
    <span class="sp"></span><a class="btn sm ghost" href="https://wa.me/234${o.phone.replace(/\D/g,'').slice(1)}" target="_blank" rel="noopener">WhatsApp customer</a>
   </div></div>`;
}
const MAIL_SUBJ={placed:o=>`Order confirmed: ${o.id} · Tiada Marketplace`,route:o=>`Your order ${o.id} is on the way!`,done:o=>`Delivered: enjoy your order ${o.id}`,issue:o=>`An update on your order ${o.id}`,refund:o=>`Refund for your order ${o.id}`,cancel:o=>`Your order ${o.id} has been cancelled`,note:o=>`A message about your order ${o.id}`};
const MAIL_L={placed:'Order confirmed',route:'On the way',done:'Delivered',issue:'Problem or delay',refund:'Refund',cancel:'Cancelled',note:'Message'};
function mailRows(o,ix){
  const sent=S.sent.filter(m=>m.oid===o.id).slice().reverse();
  const rows=[];if(!sent.some(m=>m.kind==='placed'))rows.push({kind:'placed',at:o.at,fake:true});
  if(!sent.some(m=>m.kind==='route')&&ix>=2&&o.status!=='issue')rows.push({kind:'route',at:o.at,fake:true});
  sent.forEach(m=>rows.push(m));
  const next=o.status==='new'||o.status==='packed'?'route':o.status==='route'?'done':null;
  return rows.map(m=>`<div class="mrow"><span style="color:${['refund','cancel','issue'].includes(m.kind)?'var(--red)':'var(--green)'}">${ic('check',16)}</span><span style="flex:1"><b>${MAIL_L[m.kind]}</b> <span class="hint">sent ${tstr(m.at)}</span></span><button class="btn sm soft" data-email="${o.id}|${m.kind}|${m.id||''}">View</button></div>`).join('')
   +(next?`<div class="mrow"><span style="color:#C9C2B1">${ic('clock',16)}</span><span style="flex:1"><b>${MAIL_L[next]}</b> <span class="hint">sends automatically at this step</span></span></div>`:'');
}
function sendMail(o,kind,data){S.sent.unshift({id:'m'+Date.now()+Math.random().toString(36).slice(2,6),oid:o.id,kind,at:Date.now(),to:o.email,data});save()}
function emailBody(o,kind){
  const rows=o.items.map(it=>{const p=byId(it[0]);return `<tr><td style="padding:5px 0;border-bottom:1px solid #EEE9DE">${esc(p.name)}${it[1]!=='Package'?' '+it[1]:''} × ${it[2]}${(it[3]||[]).length?`<br><small style="color:#8A5F1C">${it[3].map(w=>esc(w[0])+' → '+esc(w[1])).join(', ')}</small>`:''}</td><td style="text-align:right;font-weight:600;border-bottom:1px solid #EEE9DE">${naira(itemTotal(it))}</td></tr>`}).join('');
  const first=esc(o.name.split(' ')[0]);
  if(kind==='placed')return `<h2>Thank you for your order!</h2>Hello ${first},\n\nWe’ve received your payment and your order is now being packed at our Ojota hub.\n\n<b>Tracking code: ${o.id}</b><table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:13px">${rows}<tr><td><b>Total paid</b></td><td style="text-align:right"><b>${naira(o.total)}</b></td></tr></table><b>Delivery:</b> ${esc(o.speed)}\n<b>Address:</b> ${esc(o.addr)}`;
  if(kind==='route'){const r=o.rider||{};return `<h2>Your order is on the way</h2>Hello ${first},\n\nYour order <b>${o.id}</b> has been packed, quality checked and handed to our delivery partner.\n\n<b>Delivery partner:</b> ${esc(r.partner||r.name||'')}${r.tracking?`\n<b>Tracking number:</b> ${esc(r.tracking)}`:''}${r.driver?`\n<b>Driver:</b> ${esc(r.driver)}`:''}${r.phone?`\n<b>Phone:</b> ${fmtPhone(r.phone)}`:''}\n<b>Speed:</b> ${esc(o.speed)}\n\nPlease keep your phone line open so the driver can reach you.`}
  const D=arguments[2]||{};
  if(kind==='issue')return `<h2>An update on your order</h2>Hello ${first},

We’re sorry, there’s a problem with your order <b>${o.id}</b>.

<b>What happened:</b> ${esc(D.reason||'')}${D.note?`
${esc(D.note)}`:''}${D.eta?`
<b>New expected delivery:</b> ${esc(D.eta)}`:''}

We’re working on it and will update you again. Questions? Reply to this email or WhatsApp us on 08075110000.`;
  if(kind==='refund')return `<h2>Your refund is on its way</h2>Hello ${first},

We’ve refunded <b>${naira(D.amount||0)}</b> for your order <b>${o.id}</b>${D.full?'':' (part of your order)'}.

<b>Reason:</b> ${esc(D.reason||'')}${D.note?`
${esc(D.note)}`:''}
<b>Refunded to:</b> the bank account you paid from

It usually shows in your bank app within 24 hours, depending on your bank. We’re sorry for the trouble.`;
  if(kind==='cancel')return `<h2>Your order has been cancelled</h2>Hello ${first},

Your order <b>${o.id}</b> has been cancelled.

<b>Reason:</b> ${esc(D.reason||'')}${D.note?`
${esc(D.note)}`:''}

We’ve refunded the full <b>${naira(o.total)}</b> to the bank account you paid from. It usually shows within 1–3 working days.

We’re sorry, and we hope to serve you again soon.`;
  if(kind==='note')return `<h2>A message about your order</h2>Hello ${first},

${esc(D.note||'')}

Order: <b>${o.id}</b>

Questions? Reply to this email or WhatsApp us on 08075110000.`;
  return `<h2>Delivered! Enjoy your food</h2>Hello ${first},\n\nYour order <b>${o.id}</b> has been delivered to ${esc(o.addr)}.\n\nSomething missing or damaged? WhatsApp us within 24 hours with your TD code and a photo.\n\nWe’d love to hear how it went. Rate your items in the app.`;
}
function mailFrame(subj,to,body,cta){return `<div class="hint" style="margin:10px 0 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px"><span>To</span><b style="color:var(--ink)">${esc(to)}</b><span>Subject</span><b style="color:var(--ink)">${esc(subj)}</b></div>
  <div class="mail"><div class="mh"><img src="${ICONSRC}" alt="">TIADA MARKETPLACE</div><div class="rib">Foodstuffs and cereals</div><div class="mb">${body}<span class="cta">${cta||'Open App &amp; Shop Now'}</span></div><div class="mf">Tiada Marketplace Hub · Ojota Logistics Center, Ikorodu Road, Lagos, Nigeria<br>WhatsApp 08075110000 · care@tiadamarketplace.com<br><u>Unsubscribe</u></div></div>`}
const CTA=k=>k==='done'?'Rate your order':k==='route'||k==='issue'?'Track my order':k==='refund'||k==='cancel'?'Shop again':'Open App &amp; Shop Now';
function openEmail(oid,kind,mid){const o=S.orders.find(x=>x.id===oid),m=S.sent.find(x=>x.id===mid);
  $('#modal').innerHTML=`<div class="scrim" data-close><div class="drawer" role="dialog" aria-modal="true" aria-label="Email preview"><button class="x" data-close aria-label="Close">×</button><h2>${MAIL_L[kind]} email</h2><p class="hint" style="margin:0">Sent to the customer${m?' at '+tstr(m.at):''}.</p>${mailFrame(MAIL_SUBJ[kind](o),o.email,emailBody(o,kind,m&&m.data),CTA(kind))}</div></div>`}
const CONFIRM=[['driver','The driver called me'],['app','The partner app shows it completed'],['customer','The customer confirmed'],['tracking','Courier tracking says delivered']];
function openDeliver(o){
  $('#modal').innerHTML=`<div class="scrim center" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="Confirm delivery"><button class="x" data-close aria-label="Close">×</button>
   <h2>Was ${o.id} delivered?</h2><p class="hint" style="margin:0 0 12px">${esc(o.name)} · ${esc(o.addr)}${o.rider?' · '+esc(o.rider.partner||o.rider.name)+(o.rider.tracking?' '+esc(o.rider.tracking):''):''}</p>
   <form id="f-deliv" novalidate><p style="margin:0 0 8px;font-weight:700;font-size:13px">How did you confirm it?</p>
    <div class="upd-opts" style="grid-template-columns:minmax(0,1fr)">${CONFIRM.map((c,i)=>`<label class="uopt ${i?'':'on'}"><input type="radio" name="dconf" value="${c[0]}" ${i?'':'checked'}><span class="gi">${ic(c[0]==='driver'?'chat':c[0]==='customer'?'users':c[0]==='app'?'truck':'pin',16)}</span><span><b>${c[1]}</b></span></label>`).join('')}</div>

}
/* update status: on the way, delivered, problem, refund, cancel, message */
const UPD=[['packed','Packed','Packed and ready to go','box'],['route','On the way','Out with a rider or courier','truck'],['done','Delivered','Customer has it','check'],['issue','Problem or delay','Late, out of stock, can’t reach customer…','alert'],['refund','Refund','Full or part refund to their bank','promo'],['cancel','Cancel order','Cancels and refunds in full','logout'],['note','Send a message','Any other update by email','mail']];
const REASONS={issue:['Delivery is delayed','An item is out of stock','Rider couldn’t reach you','We need to confirm your address','Other'],refund:['An item was missing','An item was damaged','An item was out of stock','Wrong item delivered','Customer asked for a refund','Other'],cancel:['Customer asked to cancel','Items out of stock','Address outside our area','Payment issue','Other']};
let upd={k:'issue'};
function openUpdate(o){
  upd={k:o.status==='new'?'packed':o.status==='packed'?'route':o.status==='route'?'done':'issue',full:true,amount:o.total,reason:'',note:'',eta:'',email:true};
  drawUpdate(o);
}
function updData(o){return {reason:upd.reason||(REASONS[upd.k]||[''])[0],note:upd.note,eta:upd.eta,amount:upd.k==='cancel'?o.total:upd.full?o.total:+upd.amount||0,full:upd.k==='cancel'||upd.full}}
function drawUpdate(o){
  const k=upd.k,needRider=k==='route'&&!o.rider,ek=k==='cancel'?'cancel':k;
  $('#modal').innerHTML=`<div class="scrim" data-close><div class="drawer" role="dialog" aria-modal="true" aria-label="Update order"><button class="x" data-close aria-label="Close">×</button>
   <h2>Update ${o.id}</h2><p class="hint" style="margin:0 0 14px">${esc(o.name)} · now <b>${STL[o.status][0]}</b>. The customer gets an email for every update.</p>
   <form id="f-upd" novalidate>
    <div class="upd-opts">${UPD.map(u=>`<label class="uopt ${k===u[0]?'on':''}"><input type="radio" name="uk" value="${u[0]}" ${k===u[0]?'checked':''}><span class="gi">${ic(u[3],17)}</span><span><b>${u[1]}</b><small>${u[2]}</small></span></label>`).join('')}</div>
    ${needRider?`<div class="note" style="margin-bottom:12px">${ic('truck',16)}<span>Next you’ll add the delivery partner and booking number.</span></div>`:''}
    ${false?(o.state?`<div class="grid2"><div class="field"><label for="u-rname">Courier company</label><select id="u-rname"><option>GIG Logistics</option><option>DHL Nigeria</option><option>Red Star Express</option></select></div><div class="field" id="fu-trk"><label for="u-trk">Tracking number</label><input id="u-trk" placeholder="GIG-77421"></div></div><div class="field" id="fu-ph"><label for="u-rph">Courier phone</label><input id="u-rph" value="07000444000"></div>`
      :`<div class="grid2"><div class="field" id="fu-name"><label for="u-rname">Rider name</label><input id="u-rname" placeholder="e.g. Tunde"></div><div class="field" id="fu-ph"><label for="u-rph">Rider phone</label><input id="u-rph" inputmode="tel" placeholder="0801 234 5678"></div></div>`):''}
    ${REASONS[k]?`<div class="field"><label for="u-reason">Reason</label><select id="u-reason">${REASONS[k].map(r=>`<option ${upd.reason===r?'selected':''}>${r}</option>`).join('')}</select></div>`:''}
    ${k==='refund'?`<div class="row" style="margin-bottom:10px"><label class="uopt sm ${upd.full?'on':''}"><input type="radio" name="uf" value="1" ${upd.full?'checked':''}> Full refund · ${naira(o.total)}</label><label class="uopt sm ${upd.full?'':'on'}"><input type="radio" name="uf" value="0" ${upd.full?'':'checked'}> Part refund</label></div>
      ${upd.full?'':`<div class="field" id="fu-amt"><label for="u-amt">Amount to refund ₦</label><input id="u-amt" class="num" inputmode="numeric" value="${upd.amount===o.total?'':upd.amount}" placeholder="e.g. 1800"></div>`}`:''}
    ${k==='done'?`<div class="field"><label for="u-conf">How did you confirm it?</label><select id="u-conf">${CONFIRM.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>`:''}
    ${k==='issue'?`<div class="field"><label for="u-eta">New expected delivery (optional)</label><input id="u-eta" value="${esc(upd.eta)}" placeholder="e.g. Tomorrow before 2pm"></div>`:''}
    ${['issue','refund','cancel','note'].includes(k)?`<div class="field" id="fu-note"><label for="u-note">${k==='note'?'Your message':'Note for the customer (optional)'}</label><textarea id="u-note" style="min-height:90px" maxlength="500" placeholder="${k==='note'?'e.g. Your rider will arrive after 4pm today.':'e.g. We’ll replace the Coco Pops with Frosties of the same value.'}">${esc(upd.note)}</textarea></div>`:''}
    ${k==='refund'||k==='cancel'?`<div class="safe" style="margin-bottom:12px">${ic('shield',16)}<span>The refund goes back through Paystack to the bank account the customer paid from. No bank details are typed in here.</span></div>`:''}
    <button class="btn ${k==='cancel'||k==='refund'?'red':''}" type="submit" style="width:100%;height:46px">${{packed:'Mark as packed',route:'Mark as on the way',done:'Mark as delivered',issue:'Report problem',refund:'Send refund',cancel:'Cancel and refund',note:'Send message'}[k]}${k==='packed'?'':' and email customer'}</button>
    ${k==='packed'?'<p class="hint" style="margin:10px 0 0">Packing doesn’t email the customer. They get an email when it’s on the way.</p>':`<p class="hint" style="margin:14px 0 4px;font-weight:700">Email preview</p><div id="u-prev">${mailFrame(MAIL_SUBJ[ek](o),o.email,emailBody(o,ek,updData(o)),CTA(ek))}</div>`}
   </form></div></div>`;
  $('#modal .scrim').classList.add('instant');
}
function updPreview(o){const ek=upd.k;if(ek==='packed')return;const el=$('#u-prev');if(el)el.innerHTML=mailFrame(MAIL_SUBJ[ek](o),o.email,emailBody(o,ek,updData(o)),CTA(ek))}
const PARTNERS={lagos:[['Kwik Delivery','Bike'],['GIG Go','Bike'],['Gokada','Bike'],['GIG Logistics','Van, for heavy orders'],['Other','']],inter:[['GIG Logistics','Interstate'],['DHL Nigeria','Interstate'],['Red Star Express','Interstate'],['ABC Transport (park drop-off)','Interstate'],['Other','']]};

function vInv(){

  return `<div class="row" style="margin-bottom:14px"><label class="search">${ic('search',16)}<input id="iq" placeholder="Search products" value="${esc(S.iq)}" aria-label="Search products"></label>
   <div class="seg">${cats.map(c=>`<button class="${S.icat===c?'on':''}" data-icat="${esc(c)}">${c==='all'?'All':esc(c)}</button>`).join('')}</div><span class="sp"></span><button class="btn" data-edit="new">${ic('plus',16)} Add product</button></div>
  ${lowStock().length?`<div class="note" style="margin-bottom:12px">${ic('alert',16)}<span><b>${lowStock().length} product${lowStock().length>1?'s are':' is'} running low</b> (highlighted in red). Restock soon to avoid selling out.</span></div>`:''}

   <td><span class="pn"><span class="thumb">${thumb(p)}</span><span><b>${esc(p.name)}</b><span class="hint">${esc(p.cat)}${p.hidden?' · <b style="color:var(--red)">Hidden</b>':''}</span></span></span></td>
   <td class="num" style="font-size:12.5px">${p.sizes.filter(s=>!s.na).map(s=>`${s.label==='1 paint'?'Paint':s.label}: ${s.sale?`<s style="color:var(--muted)">${naira(s.price)}</s> <b>${naira(s.sale)}</b>`:naira(s.price)}`).join('<br>')}</td>

   <td><span class="stock"><button data-stk="${p.id}|-1" aria-label="One less">−</button><b class="num" style="${low?'color:var(--red)':''}">${p.stock}</b><button data-stk="${p.id}|1" aria-label="One more">+</button></span>${low?`<div style="color:var(--red);font-size:11px;font-weight:700">Below ${p.low}</div>`:''}</td>
   <td><select data-status="${p.id}" aria-label="Status for ${esc(p.name)}">${[['in','In stock'],['fast','Fast selling'],['out','Sold out'],['na','Not available']].map(o=>`<option value="${o[0]}" ${p.status===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td>
   <td><button class="vis ${p.hidden?'off':''}" data-hide="${p.id}" aria-label="${p.hidden?'Show':'Hide'} ${esc(p.name)} in the shop" title="${p.hidden?'Hidden from shoppers. Click to show':'Visible to shoppers. Click to hide'}">${ic(p.hidden?'eyeoff':'eye',17)}</button></td>
   <td><button class="btn sm ghost" data-edit="${p.id}">${ic('edit',14)} Edit</button></td></tr>`}).join('')}
  </tbody></table></div>`;

function cropSquare(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=480;const g=c.getContext('2d');g.fillStyle='#FBF9F4';g.fillRect(0,0,480,480);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,480,480);res(c.toDataURL('image/jpeg',.85))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ================= LIVE LAYER: the admin desk talks to the real server =================
   The screens above are the design. This part signs staff in, loads real orders, stock, chats
   and settings from /api/admin, and sends every change back to the server. Nothing is kept in
   the browser's storage. */
const api=async(path,opts={})=>{
  const r=await fetch(path,{method:opts.method||(opts.body?'POST':'GET'),headers:opts.body?{'Content-Type':'application/json'}:{},body:opts.body?JSON.stringify(opts.body):undefined,credentials:'same-origin',cache:'no-store'});
  let j={};try{j=await r.json()}catch(_){}
  if(r.status===401&&S.auth&&!/\/(login|setup|me)\b/.test(path)){S.auth=null;login={step:'pw',email:'',err:'Your session ended. Please sign in again.'};closeModal();render()}
  if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong. Please try again.'),{status:r.status});
  return j;
};

let SEEN=null,SEEN_CHAT=null,setupNeeded=false,setupInfo=null;

const busy=m=>{$('#ldt').textContent=m;$('#loader').hidden=false};
const idle=()=>{$('#loader').hidden=true};
const keepY=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
async function run(msg,fn,okMsg){busy(msg);try{const r=await fn();await refresh();keepY();if(okMsg)toast(typeof okMsg==='function'?okMsg(r):okMsg);return r}catch(e){toast(errMsg(e));try{await refresh();keepY()}catch(_){}}finally{idle()}}

/* ---------- server data → the shapes the screens use ---------- */
function applyData(d){
  S.auth=Object.assign({at:(S.auth&&S.auth.at)||Date.now()},d.me);
  QUICK[0]=`Hi! I’m ${d.me.name.split(' ')[0]} from Tiada. How can I help?`;
  S.products=d.products.map(p=>({id:p.id,name:p.name,cat:CAT_NAME[p.cat]||p.cat,items:p.items||undefined,sizes:p.sizes.map(s=>({label:s.label,price:s.price,sale:s.sale||null,kg:+s.kg,na:!!s.na||s.price==null})),status:p.status,stock:p.stock,low:p.low,hidden:p.hidden,img:p.img||null}));
  const Z=Object.fromEntries(d.zones.map(z=>[z.id,z]));
  S.orders=d.orders.map(o=>{(o.items||[]).forEach(i=>{if(i.pid)GONE[i.pid]=i.name});const z=Z[o.zone_id]||{};
    return {id:o.id,name:o.name,email:o.email,phone:o.phone,addr:o.address,landmark:o.landmark||'',area:z.label||o.area_label||'',state:!!z.state,speed:o.speed_label||o.speed,fee:o.delivery_fee,
      items:(o.items||[]).map(i=>[i.pid,i.size,i.qty,(i.swaps||[]).map(w=>[w.from,w.to]),i.price,i.name]),total:o.total,at:Date.parse(o.paid_at||o.created_at),status:o.status,prev:o.prev_status,
      rider:o.rider?Object.assign({name:o.rider.partner,courier:true},o.rider):null,confirm:o.confirm?Object.assign({},o.confirm,{at:Date.parse(o.confirm.at)}):null,
      issue:o.issue||{reason:''},refunds:(o.refunds||[]).map(r=>Object.assign({},r,{at:Date.parse(r.at)})),reason:(o.issue&&o.issue.reason)||'',bank:'their bank',note:o.note||'',fresh:FRESH.has(o.id)}});
  S.sent=d.messages.map(m=>({id:m.id,oid:m.order_id,kind:m.kind,at:Date.parse(m.created_at),to:m.email_to,data:m.data||{},ok:m.email_ok}));
  S.promos=d.promos.map(p=>({id:p.id,title:p.title,eyebrow:p.eyebrow||'',text:p.text||'',art:p.product_id,img:p.img||null,cls:p.cls||'',end:Date.parse(p.ends_at),on:p.is_on}));
  S.reviews=d.reviews.map(r=>({id:r.id,pid:r.product_id,name:r.name,stars:r.stars,text:r.text,at:Date.parse(r.created_at),status:r.status,order:r.order_id||'',reply:r.reply||undefined}));
  S.log=d.activity.map(a=>({t:a.text,at:Date.parse(a.created_at),by:a.staff_name||'System'}));
  const st=d.settings||{},fees=st.fees||{};
  S.fees={min:fees.min||0,lagosKg:fees.lagosKg||0,interKg:fees.interKg||0,van:fees.van||0,same:fees.same||0,express:fees.express||0,eco:fees.eco||0,
    areas:d.zones.filter(z=>!z.state).map(z=>[z.label,z.fee,z.id]),
    regions:Object.keys(REGION_NAME).map(k=>{const zs=d.zones.filter(z=>z.region===k),r=(fees.regions||{})[k]||{};return [REGION_NAME[k],r.fee!=null?r.fee:(zs[0]?zs[0].fee:0),r.days||(zs[0]&&zs[0].days)||'',k]})};
  const lay=st.layout&&st.layout.length?st.layout:Object.keys(LAYOUT_META).map(k=>[k,true]);
  S.layout=lay.filter(l=>LAYOUT_META[l[0]]).map(([k,on])=>{const m=LAYOUT_META[k].slice();m[3]=on!==false;return m});
  Object.keys(LAYOUT_META).forEach(k=>{if(!S.layout.some(x=>x[0]===k)){const m=LAYOUT_META[k].slice();m[3]=true;S.layout.push(m)}});
  S.tiles=TILE_META.map(t=>[t[0],t[1],(st.tiles||{})[t[0]]!==false]);
  S.aisles=AISLE_META.map(t=>[t[0],t[1],(st.aisles||{})[t[0]]!==false]);
  S.staff=d.staff||[];S.customers=d.customers||[];S.testMode=!!d.testMode;S.testPending=d.testPending||[];
  AUD.all[1]=S.customers.length;AUD.promo[1]=S.customers.filter(c=>c.promo_ok).length;
  applyChats(d.chats);
  computeSales();
  const nw=S.orders.filter(o=>o.status==='new'&&SEEN&&!SEEN.has(o.id));
  nw.forEach(o=>{FRESH.add(o.id);o.fresh=true});
  if(nw.length){const o=nw[0],a=$('#alertbar');a.innerHTML=`${ic('bell')} <span>New paid order <b class="num">${o.id}</b> · ${naira(o.total)} · ${esc(o.name)}${nw.length>1?` (+${nw.length-1} more)`:''}</span><button class="btn sm" data-viewo="${o.id}">Open</button>`;a.classList.add('show');setTimeout(()=>a.classList.remove('show'),9000);beep()}
  SEEN=new Set(S.orders.map(o=>o.id));
}
function applyChats(list){
  S.chats=list.map(c=>({id:c.id,name:c.name||'Guest',phone:c.email||'Guest · not signed in',status:c.status==='bot'?'closed':c.status,at:Date.parse(c.updated_at),order:'',agent:c.agent,
    msgs:c.messages.map(m=>[m.who,m.text,Date.parse(m.created_at)])}));
  const waiting=S.chats.filter(c=>c.status==='waiting');
  const nw=waiting.filter(c=>SEEN_CHAT&&!SEEN_CHAT.has(c.id));
  if(nw.length&&S.view!=='chat'){const a=$('#alertbar');a.innerHTML=`${ic('chat')} <span><b>${esc(nw[0].name)}</b> wants to chat with a person</span><button class="btn sm" data-view="chat">Open chat</button>`;a.classList.add('show');setTimeout(()=>a.classList.remove('show'),9000);beep()}
  SEEN_CHAT=new Set(waiting.map(c=>c.id).concat(SEEN_CHAT?[...SEEN_CHAT]:[]));
}
function computeSales(){
  for(let i=0;i<7;i++)DAYS[i]=new Date(Date.now()-(6-i)*86400000);
  for(let i=0;i<7;i++){const dd=DAYS[i].toDateString();SALES[i]=S.orders.filter(o=>o.status!=='cancelled'&&new Date(o.at).toDateString()===dd).reduce((a,o)=>a+o.total-(o.refunds||[]).reduce((x,r)=>x+r.amount,0),0)}
}
function topSellers(){
  const n={},since=Date.now()-7*86400000;
  S.orders.filter(o=>o.at>=since&&o.status!=='cancelled').forEach(o=>o.items.forEach(it=>{if(it[0])n[it[0]]=(n[it[0]]||0)+it[2]}));
  return Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
async function refresh(){applyData(await api('/api/admin/data'))}

/* ---------- test mode: Paystack test accounts can't receive transfers, so the owner can mark a test order paid ---------- */
function vDash(){
  if(!S.testMode)return vDashBase();
  return `<div class="note" style="margin-bottom:14px;flex-wrap:wrap">${ic('alert',16)}<span style="flex:1;min-width:220px"><b>Paystack is in test mode.</b> Test bank transfers can’t really be paid, so you can mark a waiting test order as paid here to try the rest (emails, packing, delivery). This box disappears when you switch to your live Paystack key.</span></div>
  ${S.testPending.length?`<div class="card pad" style="margin-bottom:14px"><h3>Test orders waiting for payment</h3><div class="list">${S.testPending.map(o=>`<div class="li"><span class="t"><b class="num">${esc(o.id)} · ${esc(o.name)}</b><small>${ago(Date.parse(o.created_at))}</small></span><span class="num" style="font-weight:800">${naira(o.total)}</span><button class="btn sm" data-testpay="${esc(o.id)}">Mark as paid (test)</button></div>`).join('')}</div></div>`:''}
  ${vDashBase()}`;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-testpay]');if(!t)return;e.preventDefault();e.stopImmediatePropagation();const id=t.dataset.testpay;
  run('Marking test order as paid',()=>api('/api/admin/testpay',{body:{id}}),`${id} is paid. Check the email and the Orders page.`)},true);

/* ---------- order emails: what really went out ---------- */
function mailRows(o){
  const sent=S.sent.filter(m=>m.oid===o.id).slice().reverse();
  const next=o.status==='new'||o.status==='packed'?'route':o.status==='route'?'done':null;
  return (sent.length?sent.map(m=>`<div class="mrow"><span style="color:${m.ok===false||['refund','cancel','issue'].includes(m.kind)?'var(--red)':'var(--green)'}">${ic(m.ok===false?'alert':'check',16)}</span><span style="flex:1"><b>${MAIL_L[m.kind]||esc(m.kind)}</b> <span class="hint">${m.ok===false?'saved to their inbox, but the email didn’t send':'sent '+dstr(m.at)+', '+tstr(m.at)}</span></span><button class="btn sm soft" data-email="${o.id}|${m.kind}|${m.id}">View</button></div>`).join(''):'<p class="hint" style="margin:0 0 6px">No emails yet.</p>')
   +(next?`<div class="mrow"><span style="color:#C9C2B1">${ic('clock',16)}</span><span style="flex:1"><b>${MAIL_L[next]}</b> <span class="hint">sends automatically at this step</span></span></div>`:'');
}

/* ---------- helpers that send changes ---------- */
async function orderAct(o,body,msg,filter){
  const r=await run(msg,()=>api('/api/admin/orders/'+encodeURIComponent(o.id),{body}),r=>r&&r.email&&!r.email.ok?`Saved. The email didn’t send: ${r.email.error||'check email setup'}`:{packed:`${o.id} packed. Stock updated.`,resume:'Order is back on track'}[body.action]||`Saved and emailed ${o.email}`);

/* ---------- native browser loading for in-page actions ----------
   Moving between pages is a real page load, so the browser shows its own loading by itself.
   For actions that stay on the page (sign-in, payment check, saving), a hidden frame keeps
   loading while the overlay is on screen, so the tab spinner runs too. */
(function(){
  const L=document.getElementById('loader');if(!L)return;
  const shown=()=>!L.hidden&&!L.classList.contains('out');
  let fr=null,guard=null;
  function start(){
    if(fr||window.__tiadaLeaving)return;
    fr=document.createElement('iframe');fr.setAttribute('aria-hidden','true');fr.tabIndex=-1;fr.title='';
    fr.style.cssText='position:fixed;left:-10px;top:-10px;width:1px;height:1px;border:0;opacity:0;pointer-events:none';
    fr.src='/api/hold?t='+Date.now();document.body.appendChild(fr);
    clearTimeout(guard);guard=setTimeout(stop,20000);
  }
  function stop(){clearTimeout(guard);if(!fr)return;const f=fr;fr=null;try{f.src='about:blank'}catch(_){}f.remove()}
  window.__tiadaStopFrame=stop;
  new MutationObserver(()=>{shown()?start():stop()}).observe(L,{attributes:true,attributeFilter:['hidden','class']});
  if(document.readyState==='complete'){if(shown())start()}else window.addEventListener('load',()=>{if(shown())start()},{once:true});
})();
})();
